; =====================================================================================
; Skripsi: ECDSA P-256 software (K1/K3) vs hardware offloading DS28E38 (K2/K4) di STM32F103.
; https://docs.platformio.org/page/projectconf.html
;
; Konfigurasi dikelompokkan PER BOARD. Tiap board punya satu bagian dasar [board_*] (MCU, flag
; build, ST-Link, port monitor); env firmware cukup `extends` bagian itu lalu menambah sumber
; (build_src_filter) dan flag khususnya.
;
;   Board      MCU           Bagian dasar       Env pengukuran              Env lain
;   HOST       STM32F103C8   [board_host]       k1_sw, k1_sw_auto, k2_hw    eksperimen: k1_rx, sederhana_stlink,
;                                                                           genericSTM32F103C8, softwaretes_mbedtls,
;                                                                           softwaretes
;   LOGGER     STM32F103C8   [board_logger]     logger                      logger_selftest
;   ATTACKER   STM32F030C8   [board_attacker]   attacker
;
; Dua ST-Link di bangku: '$' = host, 'X' = logger. Upload host DIKUNCI ke '$' dan logger ke 'X'
; (OpenOCD `adapter serial`), jadi `pio run -e <env> -t upload` tidak pernah menimpa board lain.
; Mengubah file ini membuat PlatformIO menghapus SEMUA folder build (.pio/build): bangun ulang dulu
; sebelum flash lewat tools/run_bench.py.
; Verifikasi setelah merapikan/refaktor kode: python tools/cek_biner.py banding
; (firmware.bin tiap env harus identik dengan acuan di tools/biner_acuan.json).
; =====================================================================================

[platformio]
; Tombol Build/Upload di VS Code memakai env ini.
default_envs = sederhana_stlink

; Nilai yang sama di SEMUA board.
[env]
platform = ststm32
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter

; Upload lewat OpenOCD dengan ST-Link DIPILIH NOMOR SERI (ada dua ST-Link di bangku). $SOURCE =
; firmware.bin, jadi alamat 0x08000000 wajib. Setelah flash, OpenOCD menyalakan DBGMCU_CR (DBG_SLEEP)
; sampai power-on reset: sebelum mengukur arus jalankan `python tools/run_bench.py nodebug` atau
; cabut-pasang daya host.
[openocd]
bin = ${platformio.packages_dir}/tool-openocd/bin/openocd.exe -s ${platformio.packages_dir}/tool-openocd/openocd/scripts
program = -c "program {$SOURCE} 0x08000000 verify reset exit"

; USB CDC (port COM virtual) STM32F103: D- = PA11, D+ = PA12. Dipakai host dan logger.
[usb_cdc]
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DUSBCON
  -DHAL_PCD_MODULE_ENABLED
  -DUSBD_VID=0x0483
  -DUSBD_PID=0x5740


; #####################################################################################
; BOARD 1: HOST (main board) - STM32F103C8 Blue Pill, HSI 48 MHz, ST-Link '$'
; Satu board fisik untuk K1 dan K2 (firmware diganti per blok arsitektur). Saat mengukur USB-C hanya
; daya; kendali run lewat logger (USART1), permintaan dari attacker (USART2). USB CDC (COM12) hanya
; untuk uji di meja.
; Kode: src/host/k1_software/, src/host/k2_hardware/, eksperimen di src/host/eksperimen/ + kode bersama src/host_common/
; #####################################################################################
[board_host]
board = genericSTM32F103C8
build_flags = ${usb_cdc.build_flags}
lib_deps =
monitor_port = COM12
debug_tool = stlink
upload_protocol = custom
upload_command = ${openocd.bin} -c "adapter serial {$$}" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32f1x.cfg ${openocd.program}

; --- HOST: firmware pengukuran (tahap D) ---------------------------------------------

; K1 software, dibangun BERTAHAP (aturan build from base), tahap 5. ECDSA P-256 standar dengan
; optimasi upstream Mbed TLS (BUKAN heavy), konfigurasi 1c: nonce hedged, zeroize, comb mati. Hanya
; Mbed TLS lokal (lib/mbedtls), tanpa library lain. Konfigurasi: include/mbedtls_k1_config.h.
; Tahap 5 (15 Nov): + jalur kendali run USART1 (host_link.h). Run dari PC: python tools/run_bench.py run A 60
; Build: pio run -e k1_sw    Upload: pio run -e k1_sw -t upload    Uji PC (USB): python tools/k1_check.py COM12
[env:k1_sw]
extends = board_host
build_src_filter = -<*> +<host/k1_software/>
build_flags =
  ${board_host.build_flags}
  -Iinclude
  -DMBEDTLS_CONFIG_FILE='"mbedtls_k1_config.h"'

; K1 software + jendela W OTOMATIS setelah boot (tanpa perintah USB; bangku ukur USB-C hanya daya).
; Hasil jendela di g_win_* (baca lewat SWD). Parameter: -DK1_AUTO_S=30 -DK1_AUTO_P=1000 -DK1_AUTO_GAP_MS=5000.
[env:k1_sw_auto]
extends = env:k1_sw
build_flags =
  ${env:k1_sw.build_flags}
  -DK1_AUTO_WINDOW

; K2 hardware (DS28E38, OneWire PA15), dibangun ulang BERTAHAP (14 Nov), tahap 5: sign + latensi, RAM,
; WFI/%S_cpu, permintaan nyata attacker lewat UART2 DMA, kendali run USART1.
; Build: pio run -e k2_hw    Upload: pio run -e k2_hw -t upload    Uji PC (USB): python tools/k2_check.py COM12 30
[env:k2_hw]
extends = board_host
build_src_filter = -<*> +<host/k2_hardware/>
lib_deps =
  paulstoffregen/OneWire@^2.3.8

; --- HOST: firmware eksperimen / uji awal (bukan firmware pengukuran tahap D) --------

; Penerima frame dari attacker di host (USART2 PA3) - TAHAP 1: hitung ok/bad/hilang.
; Cek: kirim 'S'+newline ke USB CDC.
[env:k1_rx]
extends = board_host
build_src_filter = -<*> +<host/eksperimen/k1_rx/>

; Firmware SEDERHANA: perintah teks lewat USB CDC -> DS28E38 (OneWire PA15). Kode: src/host/eksperimen/sederhana/
[env:sederhana_stlink]
extends = board_host
build_src_filter = -<*> +<host/eksperimen/sederhana/>
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  rweather/Crypto@0.4.0

; Firmware monolit lama (jembatan USB <-> DS28E38, src/host/eksperimen/monolit/). Hanya referensi; digantikan k2_hw.
[env:genericSTM32F103C8]
extends = board_host
build_src_filter = -<*> +<host/eksperimen/monolit/>
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  rweather/Crypto@0.4.0

; Uji ECDSA P-256 software TERBERAT (Mbed TLS 3.6.7, profil portable-C tanpa optimasi): batas ATAS
; beban software. Kode: src/host/eksperimen/softwaretes_mbedtls/; konfigurasi include/mbedtls_heavy_config.h.
; Profil Mbed TLS "default" (optimasi upstream aktif, pembanding): tambahkan -DMBEDTLS_PROFILE_DEFAULT
[env:softwaretes_mbedtls]
extends = board_host
build_src_filter = -<*> +<host/eksperimen/softwaretes_mbedtls/>
lib_deps =
  rweather/Crypto@0.4.0
build_flags =
  ${board_host.build_flags}
  -Iinclude
  -DMBEDTLS_CONFIG_FILE='"mbedtls_heavy_config.h"'

; Uji ECDSA P-256 murni software (micro-ecc): batas BAWAH. Kode: src/host/eksperimen/softwaretes/.
; Hanya kurva secp256r1 yang dikompilasi.
[env:softwaretes]
extends = board_host
build_src_filter = -<*> +<host/eksperimen/softwaretes/>
lib_deps =
  kmackay/micro-ecc@1.0.0
  rweather/Crypto@0.4.0
build_flags =
  ${board_host.build_flags}
  -DuECC_SUPPORTS_secp160r1=0
  -DuECC_SUPPORTS_secp192r1=0
  -DuECC_SUPPORTS_secp224r1=0
  -DuECC_SUPPORTS_secp256k1=0
  -DuECC_SUPPORT_COMPRESSED_POINT=0


; #####################################################################################
; BOARD 2: LOGGER (pencatat) - STM32F103C8 Blue Pill klon (UID nol), HSE 72 MHz, ST-Link 'X'
; INA226 (I2C1), tangkap tepi pin status host (TIM2 PA0), kendali run ke host (USART1), CSV ke PC
; lewat USB CDC. Jalur OUT USB klon rusak: perintah PC dikirim lewat nilai baud.
; Kode: src/logger/f103/ + kode bersama src/logger_common/ (logger F030 cadangan dihapus 16 Nov; lihat git
; 448befe src/logger_f030/ bila perlu).
; logger_common SENGAJA di src/, bukan lib/: objek pustaka ditautkan dalam grup terpisah sehingga tata
; letak Flash bergeser (4 B) dan firmware.bin tidak lagi identik dengan logger yang dipakai pada data
; tahap D. Begitu pula `lib_archive = no` (ikut mengubah penautan Wire). Diuji 16 Nov dengan cek_biner.py.
; #####################################################################################
[board_logger]
board = genericSTM32F103C8
; L5/L6: Serial1 (USART1 ke host) + penyangga RX besar (host mengirim hasil beruntun).
; L6b (15 Nov malam, tahap D): core STM32duino MEMBUANG tulisan USB bila paket terakhir belum diambil PC
; dalam USB_CDC_TRANSMIT_TIMEOUT ms (bawaan 3 ms; CDC_connected() di USBSerial::write). PC yang telat
; membaca >3 ms -> ~10 baris CSV hilang; antrean penuh -> write() menunggu s.d. 3 ms -> cuplikan INA226
; terlewat ('late'). Perbaikan: batas waktu 250 ms + antrean 64 paket (4 KB, ~300 ms aliran CSV).
build_flags =
  ${usb_cdc.build_flags}
  -DENABLE_HWSERIAL1
  -DSERIAL_RX_BUFFER_SIZE=512
  -DCDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=64
  -DUSB_CDC_TRANSMIT_TIMEOUT=250
lib_deps =
; Nomor COM logger berubah tiap cabut-pasang (terakhir COM18); run_bench.py memakai --logger COMxx.
monitor_port = COM18
debug_tool = stlink
upload_protocol = custom
upload_command = ${openocd.bin} -c "adapter serial X" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32f1x.cfg ${openocd.program}

; Logger F103 tahap L6B1 (dipakai pada data tahap D).
; Build: pio run -e logger    Upload: pio run -e logger -t upload   (ST-Link 'X')
[env:logger]
extends = board_logger
build_src_filter = -<*> +<logger/f103/> +<logger_common/>

; Logger + generator uji PWM 100 Hz/30% di PA6 (uji mandiri L4: jumper PA6 -> PA0, PB1 host DILEPAS).
[env:logger_selftest]
extends = env:logger
build_flags =
  ${env:logger.build_flags}
  -DL4_SELFTEST_PWM


; #####################################################################################
; BOARD 3: ATTACKER (node pembangkit permintaan) - STM32F030C8T6, HSI 48 MHz
; Frame 36 B ke host lewat USART1 PA9 (TIM3: A = 1/s, B = 10/s); konsol CH340 di USART2 PA2/PA3.
; MCU beda keluarga (Cortex-M0): definisi board kustom di boards/genericSTM32F030C8.json.
; "Serial" default di board ini = Serial2 (USART2); Serial1 (USART1 ke host) harus di-enable manual.
; Kode: src/attacker/
; #####################################################################################
[board_attacker]
board = genericSTM32F030C8
build_flags =
  -DENABLE_HWSERIAL1
lib_deps =
monitor_port = COM15
debug_tool = stlink
; Upload ST-Link TIDAK dikunci nomor seri (tak ada ST-Link tetap untuk attacker): cabut ST-Link host
; dan logger dulu, atau tambahkan `adapter serial` seperti board lain. Jalur bootloader serial CH340
; lama (nonaktif sejak 13 Nov): upload_protocol = serial, extra_scripts = extra_script_attacker.py,
; upload_port = \\.\COMxx (prefix \\.\ wajib untuk COM >= 10), upload_speed = 115200.
upload_protocol = stlink

; Auto-start mode A (1 Hz) saat boot (-DATTACKER_AUTOSTART_HZ=10 untuk mode B). Dijalankan/dihentikan
; run_bench.py lewat konsol CH340 (a/b/x).
; Build: pio run -e attacker    Upload: pio run -e attacker -t upload    Konsol: pio device monitor -e attacker
[env:attacker]
extends = board_attacker
build_src_filter = -<*> +<attacker/>
build_flags =
  ${board_attacker.build_flags}
  -DATTACKER_AUTOSTART_HZ=1
