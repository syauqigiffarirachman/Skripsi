; PlatformIO Project Configuration File — Board 1 (STM32F103C8, OneWire di PA15)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sederhana_stlink

; Pengaturan bersama
[env]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  rweather/Crypto@0.4.0
; Firmware utama hanya main.cpp; kode uji ada di src/softwaretes/ (env softwaretes)
build_src_filter = -<*> +<main.cpp>
; USB CDC (virtual COM port) lewat USB-C: D- = PA11, D+ = PA12
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DUSBCON
  -DHAL_PCD_MODULE_ENABLED
  -DUSBD_VID=0x0483
  -DUSBD_PID=0x5740

; Serial monitor (pio device monitor): ganti monitor_port sesuai COM milikmu
monitor_speed = 115200
monitor_port = COM12
monitor_eol = LF
monitor_filters = send_on_enter

; SEMUA upload lewat ST-Link (tanpa bootloader): firmware dimuat di 0x08000000.
; USB-C hanya untuk serial (port COM virtual). Tombol Upload di VS Code memakai env bawaan di atas.

; Firmware SEDERHANA: perintah teks lewat USB CDC -> DS28E38 (OneWire PA15). Kode: src/sederhana/
; Upload: pio run -t upload   (atau  pio run -e sederhana_stlink -t upload)
[env:sederhana_stlink]
extends = env:genericSTM32F103C8
build_src_filter = -<*> +<sederhana/>

; Firmware utama (main.cpp, jembatan USB <-> chip): pio run -e genericSTM32F103C8 -t upload
[env:genericSTM32F103C8]
upload_protocol = stlink
debug_tool = stlink

; K1 software, dibangun BERTAHAP (aturan build from base). Tahap saat ini: 1 (base standar) di src/k1_software/.
; ECDSA P-256 standar: nonce RFC 6979 + optimasi upstream Mbed TLS (BUKAN heavy). Hanya Mbed TLS lokal
; (lib/mbedtls), tanpa library lain. Konfigurasi: include/mbedtls_k1_config.h.
; Build: pio run -e k1_sw    Upload: pio run -e k1_sw -t upload   (cabut ST-Link setelah upload)
; Uji PC: python tools/k1_check.py COM12
; Tahap 5 (15 Nov): + jalur kendali run USART1 (src/host_common/host_link.h). Di bangku ada dua ST-Link; flash host:
;   openocd -c 'adapter serial {$}' -f interface/stlink.cfg -c 'transport select hla_swd' -f target/stm32f1x.cfg -c 'program {.pio/build/k1_sw/firmware.elf} verify reset exit'
; Run dari PC: python tools/run_bench.py run A 60
[env:k1_sw]
extends = env:genericSTM32F103C8
build_src_filter = -<*> +<k1_software/>
lib_deps =
build_flags =
  ${env.build_flags}
  -Iinclude
  -DMBEDTLS_CONFIG_FILE='"mbedtls_k1_config.h"'

; K1 software + jendela W OTOMATIS setelah boot (tanpa perintah USB; bangku ukur USB-C hanya daya).
; Hasil jendela di g_win_* (baca lewat SWD). Parameter: -DK1_AUTO_S=30 -DK1_AUTO_P=1000 -DK1_AUTO_GAP_MS=5000.
; Upload DIKUNCI ke ST-Link '$' (host) karena di bangku ada dua ST-Link: pio run -e k1_sw_auto -t upload
[env:k1_sw_auto]
extends = env:k1_sw
build_flags =
  ${env:k1_sw.build_flags}
  -DK1_AUTO_WINDOW
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd.exe -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -c "adapter serial {$$}" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32f1x.cfg -c "program {$SOURCE} 0x08000000 verify reset exit"

; K2 hardware (DS28E38), dibangun ulang BERTAHAP (build from base, 14 Nov). Tahap saat ini: 4 (sign + latensi, RAM, WFI/%S_cpu,
; permintaan nyata dari attacker lewat UART2 DMA) di src/k2_hardware/. Pengganti firmware monolit src/main.cpp (env genericSTM32F103C8, hanya referensi).
; Build: pio run -e k2_hw    Upload: pio run -e k2_hw -t upload   (cabut ST-Link setelah upload)
; Uji PC: python tools/k2_check.py COM12 30
[env:k2_hw]
extends = env:genericSTM32F103C8
build_src_filter = -<*> +<k2_hardware/>
lib_deps =
  paulstoffregen/OneWire@^2.3.8

; Penerima frame dari attacker di host (USART2 PA3) - TAHAP 1: hitung ok/bad/hilang. Terpisah dari k1_sw.
; Upload: pio run -e k1_rx -t upload (ST-Link terpasang di host). Cek: kirim 'S'+newline ke USB CDC.
[env:k1_rx]
extends = env:genericSTM32F103C8
build_src_filter = -<*> +<k1_rx/>
lib_deps =

; LOGGER (Blue Pill STM32F103C8, pencatat INA226 + pin status), dibangun BERTAHAP (build from base, 13 Nov).
; Tahap saat ini: L1 (jam HSE 72 MHz, USB CDC, perintah I) di src/logger/. Terpisah dari env host.
; Ada DUA ST-Link di bangku: '$' = host, 'X' = logger. Upload memakai perintah OpenOCD sendiri yang
; menyebut serial 'X' supaya tidak pernah menimpa firmware host. Cek: pio run -e logger -t upload
[env:logger]
extends = env:genericSTM32F103C8
build_src_filter = -<*> +<logger/> +<logger_common/>
lib_deps =
; L5/L6: Serial1 (USART1 ke host) + penyangga RX besar (host mengirim hasil beruntun), antrean TX USB
; 16 paket (1 KB) supaya aliran CSV ~12 KB/s tidak menahan loop cuplik.
build_flags =
  ${env.build_flags}
  -DENABLE_HWSERIAL1
  -DSERIAL_RX_BUFFER_SIZE=512
  -DCDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=16
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd.exe -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -c "adapter serial X" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32f1x.cfg -c "program {$SOURCE} 0x08000000 verify reset exit"
; Sejak 14 Nov malam ST-Link 'X' kembali ke logger Blue Pill F103 (env ini). env logger_f030 hanya cadangan.

; Logger + generator uji PWM 100 Hz/30% di PA6 (uji mandiri L4: jumper PA6 -> PA0, PB1 host DILEPAS).
; Upload: pio run -e logger_selftest -t upload
[env:logger_selftest]
extends = env:logger
build_flags =
  ${env:logger.build_flags}
  -DL4_SELFTEST_PWM

; LOGGER versi F030C8T6 (board yang dipakai sejak 14 Nov 2026; tinggal board F030 yang tersedia).
; Tidak extends env F103 (MCU beda keluarga: tanpa USB, tanpa DWT, tanpa TIM2, RAM 8 KB).
; CSV/konsol ke PC lewat USART2 PA2/PA3 -> USB-TTL CH340 (115200 8N1). Upload lewat OpenOCD ST-Link
; serial 'X' (logger), target stm32f0x.cfg, supaya tidak pernah menimpa host ('$').
; Monitor: pio device monitor -e logger_f030 --port COMxx   (nomor COM CH340 berubah tiap cabut-pasang)
[env:logger_f030]
platform = ststm32
board = genericSTM32F030C8
framework = arduino
build_src_filter = -<*> +<logger_f030/> +<logger_common/>
lib_deps =
; build_flags WAJIB ditimpa: [env] global menurunkan flag USB CDC (-DUSBCON dst) yang membuat build F030 gagal.
build_flags =
  -DLOGGER_F030
  -DLOGGER_LED_PIN=PC13
; monitor_port juga diwarisi dari [env] global (COM12 = host); ganti ke COM CH340 logger saat memantau.
monitor_port = COM17
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd.exe -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -c "adapter serial X" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32f0x.cfg -c "program {$SOURCE} 0x08000000 verify reset exit"
monitor_speed = 115200
monitor_eol = LF

; Uji ECDSA P-256 software TERBERAT (Mbed TLS 3.6.7, profil portable-C tanpa optimasi) — kelompok K1/K3.
; Kode: src/softwaretes_mbedtls/; library di lib/mbedtls; konfigurasi di include/mbedtls_heavy_config.h.
; Upload: pio run -e softwaretes_mbedtls -t upload   (cabut ST-Link setelah upload)
; Profil Mbed TLS "default" (optimasi upstream aktif, pembanding): tambahkan -DMBEDTLS_PROFILE_DEFAULT
[env:softwaretes_mbedtls]
extends = env:genericSTM32F103C8
build_src_filter = -<*> +<softwaretes_mbedtls/>
lib_deps =
  rweather/Crypto@0.4.0
build_flags =
  ${env.build_flags}
  -Iinclude
  -DMBEDTLS_CONFIG_FILE='"mbedtls_heavy_config.h"'

; Uji ECDSA P-256 murni software (micro-ecc) — kode di src/softwaretes/, upload via ST-Link.
; Cabut ST-Link setelah upload. Hanya kurva secp256r1 yang dikompilasi.
[env:softwaretes]
extends = env:genericSTM32F103C8
build_src_filter = -<*> +<softwaretes/>
lib_deps =
  kmackay/micro-ecc@1.0.0
  rweather/Crypto@0.4.0
build_flags =
  ${env.build_flags}
  -DuECC_SUPPORTS_secp160r1=0
  -DuECC_SUPPORTS_secp192r1=0
  -DuECC_SUPPORTS_secp224r1=0
  -DuECC_SUPPORTS_secp256k1=0
  -DuECC_SUPPORT_COMPRESSED_POINT=0

; Board 2/3 — Node pembangkit permintaan (STM32F030C8T6), kode: src/attacker/
; MCU beda keluarga (Cortex-M0 vs M3 di board 1), jadi TIDAK extends env:genericSTM32F103C8;
; board/lib_deps/build_flags ditulis ulang di sini agar tidak mewarisi flag USB CDC milik board 1.
; Definisi board kustom ada di boards/genericSTM32F030C8.json (dibaca otomatis oleh PlatformIO).
; Upload lewat bootloader serial CH340. Board punya sirkuit auto-reset (DTR/RTS -> BOOT0/NRST),
; jadi BOOT0 dan reset ditoggle otomatis oleh extra_script_attacker.py -- tidak perlu jumper
; manual lagi:
;   pio run -e attacker -t upload
; Monitor/konsol setelah upload:
;   pio device monitor -e attacker
[env:attacker]
platform = ststm32
board = genericSTM32F030C8
framework = arduino
build_src_filter = -<*> +<attacker/>
lib_deps =
; "Serial" default di board ini = Serial2 (USART2, SERIAL_UART_INSTANCE=2 di variant_generic.h).
; Serial1 (USART1, dipakai CH340) TIDAK otomatis aktif di core ini -- harus di-enable manual.
build_flags =
  -DENABLE_HWSERIAL1
  -DATTACKER_AUTOSTART_HZ=1
; 13 Nov: upload sekarang lewat ST-Link (SWD). Jalur bootloader serial CH340 lama dinonaktifkan;
; kalau mau kembali: upload_protocol = serial, extra_scripts = extra_script_attacker.py,
; upload_port = \\.\COMxx (prefix \\.\ wajib untuk COM >= 10), upload_speed = 115200.
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_port = COM15
monitor_eol = LF
monitor_filters = send_on_enter
