; PlatformIO Project Configuration File — Board 1 (STM32F103C8, OneWire di PA15)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = usb_dfu

; Pengaturan bersama
[env]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  rweather/Crypto@0.4.0
; Firmware utama hanya main.cpp; kode uji ada di src/softwaretes/ (env softwaretes)
build_src_filter = -<*> +<main.cpp>
; USB CDC (virtual COM port) lewat USB-C: D- = PA11, D+ = PA12
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DUSBCON
  -DHAL_PCD_MODULE_ENABLED
  -DUSBD_VID=0x0483
  -DUSBD_PID=0x5740

; Upload lewat USB-C (DFU) memakai STM32duino bootloader (generic_boot20_pc13).
; Bootloader menempati 0x08000000-0x08001FFF, aplikasi mulai di 0x08002000.
; Jalankan upload, lalu tekan RESET: dfu-util menunggu (-w) sampai bootloader muncul.
; Butuh driver WinUSB/libusb (Zadig) untuk device 1EAF:0003.
[env:usb_dfu]
board_build.flash_offset = 0x2000
upload_protocol = custom
upload_command = "$PROJECT_PACKAGES_DIR/tool-dfuutil/bin/dfu-util" -w -d 1eaf:0003 -a 2 -D $SOURCE -R

; Pemulihan lewat ST-Link (tanpa bootloader). PERHATIAN: menimpa bootloader di 0x08000000.
[env:genericSTM32F103C8]
upload_protocol = stlink
debug_tool = stlink

; Uji ECDSA P-256 murni software (micro-ecc) — kode di src/softwaretes/, upload via ST-Link.
; Cabut ST-Link setelah upload. Hanya kurva secp256r1 yang dikompilasi.
[env:softwaretes]
extends = env:genericSTM32F103C8
build_src_filter = -<*> +<softwaretes/>
lib_deps =
  kmackay/micro-ecc@1.0.0
  rweather/Crypto@0.4.0
build_flags =
  ${env.build_flags}
  -DuECC_SUPPORTS_secp160r1=0
  -DuECC_SUPPORTS_secp192r1=0
  -DuECC_SUPPORTS_secp224r1=0
  -DuECC_SUPPORTS_secp256k1=0
  -DuECC_SUPPORT_COMPRESSED_POINT=0
