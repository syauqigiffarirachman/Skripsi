; =====================================================================================
; Skripsi: ECDSA P-256 software (K1/K3) vs hardware offloading DS28E38 (K2/K4) di STM32F103.
; https://docs.platformio.org/page/projectconf.html
;
; Env dikelompokkan menurut PERAN (FINAL / PENDUKUNG / DEV), dan di dalam kelompok FINAL per board. Tiap board punya satu
; bagian dasar [board_*] (MCU, flag build, ST-Link, port monitor); env firmware `extends` bagian itu lalu menambah sumber
; (build_src_filter) dan flag khususnya. Nama env TIDAK diubah (tools/1_akuisisi/run_bench.py membaca .pio/build/<env>).
;
;   KELOMPOK 1 FINAL (data 18 Nov 2026)       KELOMPOK 2 PENDUKUNG            KELOMPOK 3 DEV
;   HOST     host_k1_stop (K1S)               host_k1_stop_auto / _comb(_auto) host_s0a_lse*, host_s0_stop, host_s1_rtc,
;            host_k2_stop (K2S)               host_k*_stop_diag_auto           host_s2_rx, host_s2_trace, host_ds_od*,
;                                             host_k2_stop_auto/_long_auto/_dbg k1_sw, k1_sw_auto, k2_hw (tahap D),
;                                                                              k1_rx, sederhana_stlink, genericSTM32F103C8,
;                                                                              softwaretes_mbedtls, softwaretes
;   LOGGER   logger                           logger_selftest
;   ATTACKER attacker
;
; Dasar per board: [board_host] (STM32F103C8, ST-Link '$'), [board_logger] (STM32F103C8 klon, ST-Link 'X'),
; [board_attacker] (STM32F030C8). Peta alur: docs/PETA_ALUR.md.
;
; Dua ST-Link di bangku: '$' = host, 'X' = logger. Upload host DIKUNCI ke '$' dan logger ke 'X'
; (OpenOCD `adapter serial`), jadi `pio run -e <env> -t upload` tidak pernah menimpa board lain.
; Mengubah file ini membuat PlatformIO menghapus SEMUA folder build (.pio/build): bangun ulang dulu
; sebelum flash lewat tools/1_akuisisi/run_bench.py.
; Verifikasi setelah merapikan/refaktor kode: python tools/4_verifikasi/cek_biner.py banding
; (firmware.bin tiap env harus identik dengan acuan di tools/4_verifikasi/biner_acuan.json).
; =====================================================================================

[platformio]
; Tombol Build/Upload di VS Code memakai env ini.
default_envs = sederhana_stlink

; Nilai yang sama di SEMUA board.
[env]
platform = ststm32
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter

; Upload lewat OpenOCD dengan ST-Link DIPILIH NOMOR SERI (ada dua ST-Link di bangku). $SOURCE =
; firmware.bin, jadi alamat 0x08000000 wajib. Setelah flash, OpenOCD menyalakan DBGMCU_CR (DBG_SLEEP)
; sampai power-on reset: sebelum mengukur arus jalankan `python tools/1_akuisisi/run_bench.py nodebug` atau
; cabut-pasang daya host.
[openocd]
bin = ${platformio.packages_dir}/tool-openocd/bin/openocd.exe -s ${platformio.packages_dir}/tool-openocd/openocd/scripts
program = -c "program {$SOURCE} 0x08000000 verify reset exit"

; USB CDC (port COM virtual) STM32F103: D- = PA11, D+ = PA12. Dipakai host dan logger.
[usb_cdc]
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DUSBCON
  -DHAL_PCD_MODULE_ENABLED
  -DUSBD_VID=0x0483
  -DUSBD_PID=0x5740

; #####################################################################################
; KELOMPOK 1 - FINAL: env yang membangun firmware PENGAMBILAN DATA 18 Nov 2026
; Hanya 4 env ini yang dipakai data akhir: host_k1_stop (K1S), host_k2_stop (K2S), logger, attacker.
; sha256 firmware.bin-nya sama dengan data/manifes_firmware_stop.md dan tools/4_verifikasi/biner_acuan.json
; (periksa: python tools/4_verifikasi/cek_biner.py banding host_k1_stop host_k2_stop logger attacker).
; Peta alur per board: README.md dan docs/PETA_ALUR.md.
; #####################################################################################

; #####################################################################################
; BOARD 1: HOST (main board) - STM32F103C8 Blue Pill, HSI 48 MHz, ST-Link '$'
; Satu board fisik untuk K1 dan K2 (firmware diganti per blok arsitektur). Saat mengukur USB-C hanya
; daya; kendali run lewat logger (USART1), permintaan dari attacker (USART2). USB CDC (COM12) hanya
; untuk uji di meja.
; Kode: FINAL: src/host/final/ (+ src/host/bersama/host_util.h); DEV: src/host/dev/
; #####################################################################################
[board_host]
board = genericSTM32F103C8
build_flags = ${usb_cdc.build_flags}
lib_deps =
monitor_port = COM12
debug_tool = stlink
upload_protocol = custom
upload_command = ${openocd.bin} -c "adapter serial {$$}" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32f1x.cfg ${openocd.program}

; Langkah 8 / S3: K1 (Mbed TLS ECDSA P-256, konfigurasi 1c) + Stop mode di antara permintaan attacker, kendali run
; USART1 ke logger (arsitektur "K1S"). Flash: python tools/1_akuisisi/flash_stop.py .pio/build/host_k1_stop/firmware.elf
; Uji: python tools/1_akuisisi/run_bench.py run A 60 --logger COM18 --attacker COM22
[env:host_k1_stop]
extends = board_host
build_src_filter = -<*> +<host/final/k1_stop/>
build_flags =
  ${board_host.build_flags}
  -Iinclude
  -DMBEDTLS_CONFIG_FILE='"mbedtls_k1_config.h"'

; Langkah 9 / S4: K2 (DS28E38 overdrive + polling) + Stop mode (tunggu chip ~100 ms di Stop). Arsitektur "K2S".
[env:host_k2_stop]
extends = board_host
build_src_filter = -<*> +<host/final/k2_stop/>

; #####################################################################################
; BOARD 2: LOGGER (pencatat) - STM32F103C8 Blue Pill klon (UID nol), HSE 72 MHz, ST-Link 'X'
; INA226 (I2C1), tangkap tepi pin status host (TIM2 PA0), kendali run ke host (USART1), CSV ke PC
; lewat USB CDC. Jalur OUT USB klon rusak: perintah PC dikirim lewat nilai baud.
; Kode: src/logger/ (f103/main.cpp = alur, modul/ = INA226, tepi, laporan) (logger F030 cadangan dihapus 16 Nov; lihat git
; 448befe src/logger_f030/ bila perlu).
; logger/modul SENGAJA di src/, bukan lib/: objek pustaka ditautkan dalam grup terpisah sehingga tata
; letak Flash bergeser (4 B) dan firmware.bin tidak lagi identik dengan logger yang dipakai pada data
; tahap D. Begitu pula `lib_archive = no` (ikut mengubah penautan Wire). Diuji 16 Nov dengan cek_biner.py.
; #####################################################################################
[board_logger]
board = genericSTM32F103C8
; L5/L6: Serial1 (USART1 ke host) + penyangga RX besar (host mengirim hasil beruntun).
; L6b (15 Nov malam, tahap D): core STM32duino MEMBUANG tulisan USB bila paket terakhir belum diambil PC
; dalam USB_CDC_TRANSMIT_TIMEOUT ms (bawaan 3 ms; CDC_connected() di USBSerial::write). PC yang telat
; membaca >3 ms -> ~10 baris CSV hilang; antrean penuh -> write() menunggu s.d. 3 ms -> cuplikan INA226
; terlewat ('late'). Perbaikan: batas waktu 250 ms + antrean 64 paket (4 KB, ~300 ms aliran CSV).
build_flags =
  ${usb_cdc.build_flags}
  -DENABLE_HWSERIAL1
  -DSERIAL_RX_BUFFER_SIZE=512
  -DCDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=64
  -DUSB_CDC_TRANSMIT_TIMEOUT=250
lib_deps =
; Nomor COM logger berubah tiap cabut-pasang (terakhir COM18); run_bench.py memakai --logger COMxx.
monitor_port = COM18
debug_tool = stlink
upload_protocol = custom
upload_command = ${openocd.bin} -c "adapter serial X" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32f1x.cfg ${openocd.program}

; Logger F103 tahap L6B1 (dipakai pada data tahap D).
; Build: pio run -e logger    Upload: pio run -e logger -t upload   (ST-Link 'X')
[env:logger]
extends = board_logger
build_src_filter = -<*> +<logger/f103/> +<logger/modul/>

; #####################################################################################
; BOARD 3: ATTACKER (node pembangkit permintaan) - STM32F030C8T6, HSI 48 MHz
; Frame 36 B ke host lewat USART1 PA9 (TIM3: A = 1/s, B = 10/s); konsol CH340 di USART2 PA2/PA3.
; MCU beda keluarga (Cortex-M0): definisi board kustom di boards/genericSTM32F030C8.json.
; "Serial" default di board ini = Serial2 (USART2); Serial1 (USART1 ke host) harus di-enable manual.
; Kode: src/attacker/
; #####################################################################################
[board_attacker]
board = genericSTM32F030C8
build_flags =
  -DENABLE_HWSERIAL1
lib_deps =
monitor_port = COM15
debug_tool = stlink
; Upload ST-Link TIDAK dikunci nomor seri (tak ada ST-Link tetap untuk attacker): cabut ST-Link host
; dan logger dulu, atau tambahkan `adapter serial` seperti board lain. Jalur bootloader serial CH340
; lama (nonaktif sejak 13 Nov): upload_protocol = serial, extra_scripts = tools/dev/extra_script_attacker.py,
; upload_port = \\.\COMxx (prefix \\.\ wajib untuk COM >= 10), upload_speed = 115200.
upload_protocol = stlink

; Auto-start mode A (1 Hz) saat boot (-DATTACKER_AUTOSTART_HZ=10 untuk mode B). Dijalankan/dihentikan
; run_bench.py lewat konsol CH340 (a/b/x).
; Build: pio run -e attacker    Upload: pio run -e attacker -t upload    Konsol: pio device monitor -e attacker
[env:attacker]
extends = board_attacker
build_src_filter = -<*> +<attacker/>
build_flags =
  ${board_attacker.build_flags}
  -DATTACKER_AUTOSTART_HZ=1

; #####################################################################################
; KELOMPOK 2 - PENDUKUNG: kode FINAL yang sama + satu flag (BUKAN data utama)
; Sumber = src/host/final/k1_stop atau k2_stop. Hanya -D flag yang menambah perilaku (AUTO, DIAG_*, DBG_RX).
; Dipakai untuk pengembangan, bukti B1/B2, dan diagnosis frame hilang; tidak dipakai mengambil data akhir.
; #####################################################################################

; K1 + Stop, jendela S60 OTOMATIS berulang (tanpa perintah logger; jalur logger->host tak perlu). Uji: python tools/dev/tahap_stop/k1s_run.py A 60
[env:host_k1_stop_auto]
extends = env:host_k1_stop
build_flags =
  ${env:host_k1_stop.build_flags}
  -DK1S_AUTO

; K2S dengan jendela S60 OTOMATIS berulang (tanpa perintah logger). Uji: python tools/dev/tahap_stop/k1s_run.py A 60
[env:host_k2_stop_auto]
extends = env:host_k2_stop
build_flags =
  ${board_host.build_flags}
  -DK2S_AUTO

; B2 (18 Nov): uji sensitivitas konfigurasi software. K1S IDENTIK (kode sama) tetapi tabel comb Mbed TLS AKTIF
; (MBEDTLS_ECP_FIXED_POINT_OPTIM=1, include/dev/mbedtls_k1_comb_config.h). BUKAN baseline skripsi; dipakai hanya untuk
; menyatakan batasan "82 % lebih cepat" terhadap konfigurasi software. Env terpisah -> pustaka Mbed TLS dibangun
; sendiri di .pio/build/host_k1_stop_comb (tidak tertukar dengan baseline). Flash: python tools/1_akuisisi/flash_stop.py .pio/build/host_k1_stop_comb_auto/firmware.elf
[env:host_k1_stop_comb]
extends = board_host
build_src_filter = -<*> +<host/final/k1_stop/>
build_flags =
  ${board_host.build_flags}
  -Iinclude
  -DMBEDTLS_CONFIG_FILE='"dev/mbedtls_k1_comb_config.h"'

[env:host_k1_stop_comb_auto]
extends = env:host_k1_stop_comb
build_flags =
  ${env:host_k1_stop_comb.build_flags}
  -DK1S_AUTO

; B1 (18 Nov): build DIAGNOSTIK -DDIAG_SIG. Jalur layanan identik dengan K1S/K2S final; tambahan hanya menyalin r||s
; 30 tanda tangan pertama dan mengirimnya sebagai baris >SIG sebelum >DONE. Verifikasi: python tools/4_verifikasi/b1_verifikasi.py K1S|K2S
; BUKAN firmware data. Flash: python tools/1_akuisisi/flash_stop.py .pio/build/host_k1_stop_diag_auto/firmware.elf
[env:host_k1_stop_diag_auto]
extends = env:host_k1_stop_auto
build_flags =
  ${env:host_k1_stop_auto.build_flags}
  -DDIAG_SIG

[env:host_k2_stop_diag_auto]
extends = env:host_k2_stop_auto
build_flags =
  ${env:host_k2_stop_auto.build_flags}
  -DDIAG_SIG

; Diagnosis frame hilang K2S (18 Nov): K2S + rincian tanda tangan lambat (>150 ms) sebagai baris >LNG. python tools/4_verifikasi/diag_long.py
[env:host_k2_stop_long_auto]
extends = env:host_k2_stop_diag_auto
build_flags =
  ${env:host_k2_stop_diag_auto.build_flags}
  -DDIAG_LONG

; K2S dengan diagnostik frame rusak/hilang (18 Nov), dibaca lewat SWD: g_d_*
[env:host_k2_stop_dbg]
extends = env:host_k2_stop
build_flags =
  ${board_host.build_flags}
  -DDBG_RX

; Logger + generator uji PWM 100 Hz/30% di PA6 (uji mandiri L4: jumper PA6 -> PA0, PB1 host DILEPAS).
[env:logger_selftest]
extends = env:logger
build_flags =
  ${env:logger.build_flags}
  -DL4_SELFTEST_PWM

; #####################################################################################
; KELOMPOK 3 - DEV: kode pengembangan, TIDAK ada di data akhir
; 3a. Tangga menuju Stop mode (src/host/dev/tahap_stop) dan eksperimen overdrive DS28E38 (ds_od).
; 3b. Firmware tahap D tanpa Stop (src/host/dev/tahap_d): k1_sw, k1_sw_auto, k2_hw.
; 3c. Eksperimen awal (src/host/dev/eksperimen): k1_rx, sederhana, monolit, softwaretes*.
; #####################################################################################

; Langkah 4 / S0a: uji kristal LSE 32,768 kHz + RTC (BELUM Stop). PB1 = kotak 4 Hz dari RTC -> logger PA0;
; PC13 = RTCCLK/64. Uji: python tools/dev/tahap_stop/s0a_lse.py --logger COMxx 60
[env:host_s0a_lse]
extends = board_host
build_src_filter = -<*> +<host/dev/tahap_stop/s0a_lse/>

; S0a varian START DINGIN: LSE mati 15 s (kristal berhenti bergetar) sebelum LSEON di tiap boot.
[env:host_s0a_lse_dingin]
extends = env:host_s0a_lse
build_flags =
  ${board_host.build_flags}
  -DS0A_COLD_WAIT_MS=15000

; Langkah 5 / S0: Stop mode minimal selamanya -> lantai arus papan. TANPA USB CDC. Jendela aman 5 s setelah
; boot untuk flash ulang (selama Stop SWD tidak tersambung: tekan RESET host lalu flash).
; Ukur: python tools/dev/tahap_stop/s0_stop.py --logger COMxx 60
[env:host_s0_stop]
extends = board_host
build_src_filter = -<*> +<host/dev/tahap_stop/s0_stop/>
build_flags =

; Langkah 6 / S1: Stop + bangun dari alarm RTC tiap 1 s, kerja 50 ms, pulih 48 MHz, T_sleep dari RTC.
; Flag CDC dipertahankan supaya jam = K1/K2 (48 MHz); USB dimatikan di awal. Ukur: python tools/dev/tahap_stop/s1_rtc.py
[env:host_s1_rtc]
extends = board_host
build_src_filter = -<*> +<host/dev/tahap_stop/s1_rtc/>

; Langkah 7 / S2: Stop, bangun oleh FRAME attacker (EXTI3 PA3, event) + terima utuh dengan sinkron bit di byte
; pertama 0xA5 (tanpa mengubah attacker); kerja 20 ms per frame; jendela 10 s. Ukur: python tools/dev/tahap_stop/s2_rx.py
[env:host_s2_rx]
extends = board_host
build_src_filter = -<*> +<host/dev/tahap_stop/s2_rx/>

; S2 varian JEJAK: merekam waktu tepi PA3 sesudah bangun pertama (g_trace/g_trace_n, dibaca lewat SWD) untuk
; menyetel sinkron bit.
[env:host_s2_trace]
extends = env:host_s2_rx
build_flags =
  ${board_host.build_flags}
  -DS2_TRACE

; EKSPERIMEN: DS28E38 overdrive + tunggu sign berbasis polling (bit-banging 1-Wire sendiri di PA15, hasil lewat
; USART1 -> logger). Flash: python tools/1_akuisisi/flash_stop.py .pio/build/host_ds_od/firmware.elf ; uji: python tools/dev/tahap_stop/ds_od.py
[env:host_ds_od]
extends = board_host
build_src_filter = -<*> +<host/dev/eksperimen/ds_overdrive/>

; Uji ketahanan overdrive: 100 tanda tangan ODPOLL pada konfigurasi titik tengah + 10 STDPOLL. python tools/dev/tahap_stop/ds_od.py --detik 60
[env:host_ds_od_stress]
extends = env:host_ds_od
build_flags =
  ${board_host.build_flags}
  -DDS_STRESS

; K1 software, dibangun BERTAHAP (aturan build from base), tahap 5. ECDSA P-256 standar dengan
; optimasi upstream Mbed TLS (BUKAN heavy), konfigurasi 1c: nonce hedged, zeroize, comb mati. Hanya
; Mbed TLS lokal (lib/mbedtls), tanpa library lain. Konfigurasi: include/mbedtls_k1_config.h.
; Tahap 5 (15 Nov): + jalur kendali run USART1 (host_link.h). Run dari PC: python tools/1_akuisisi/run_bench.py run A 60
; Build: pio run -e k1_sw    Upload: pio run -e k1_sw -t upload    Uji PC (USB): python tools/dev/tahap_d/k1_check.py COM12
[env:k1_sw]
extends = board_host
build_src_filter = -<*> +<host/dev/tahap_d/k1_software/>
build_flags =
  ${board_host.build_flags}
  -Iinclude
  -DMBEDTLS_CONFIG_FILE='"mbedtls_k1_config.h"'

; K1 software + jendela W OTOMATIS setelah boot (tanpa perintah USB; bangku ukur USB-C hanya daya).
; Hasil jendela di g_win_* (baca lewat SWD). Parameter: -DK1_AUTO_S=30 -DK1_AUTO_P=1000 -DK1_AUTO_GAP_MS=5000.
[env:k1_sw_auto]
extends = env:k1_sw
build_flags =
  ${env:k1_sw.build_flags}
  -DK1_AUTO_WINDOW

; K2 hardware (DS28E38, OneWire PA15), dibangun ulang BERTAHAP (14 Nov), tahap 5: sign + latensi, RAM,
; WFI/%S_cpu, permintaan nyata attacker lewat UART2 DMA, kendali run USART1.
; Build: pio run -e k2_hw    Upload: pio run -e k2_hw -t upload    Uji PC (USB): python tools/dev/tahap_d/k2_check.py COM12 30
[env:k2_hw]
extends = board_host
build_src_filter = -<*> +<host/dev/tahap_d/k2_hardware/>
lib_deps =
  paulstoffregen/OneWire@^2.3.8

; Penerima frame dari attacker di host (USART2 PA3) - TAHAP 1: hitung ok/bad/hilang.
; Cek: kirim 'S'+newline ke USB CDC.
[env:k1_rx]
extends = board_host
build_src_filter = -<*> +<host/dev/eksperimen/k1_rx/>

; Firmware SEDERHANA: perintah teks lewat USB CDC -> DS28E38 (OneWire PA15). Kode: src/host/dev/eksperimen/sederhana/
[env:sederhana_stlink]
extends = board_host
build_src_filter = -<*> +<host/dev/eksperimen/sederhana/>
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  rweather/Crypto@0.4.0

; Firmware monolit lama (jembatan USB <-> DS28E38, src/host/dev/eksperimen/monolit/). Hanya referensi; digantikan k2_hw.
[env:genericSTM32F103C8]
extends = board_host
build_src_filter = -<*> +<host/dev/eksperimen/monolit/>
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  rweather/Crypto@0.4.0

; Uji ECDSA P-256 software TERBERAT (Mbed TLS 3.6.7, profil portable-C tanpa optimasi): batas ATAS
; beban software. Kode: src/host/dev/eksperimen/softwaretes_mbedtls/; konfigurasi include/dev/mbedtls_heavy_config.h.
; Profil Mbed TLS "default" (optimasi upstream aktif, pembanding): tambahkan -DMBEDTLS_PROFILE_DEFAULT
[env:softwaretes_mbedtls]
extends = board_host
build_src_filter = -<*> +<host/dev/eksperimen/softwaretes_mbedtls/>
lib_deps =
  rweather/Crypto@0.4.0
build_flags =
  ${board_host.build_flags}
  -Iinclude
  -DMBEDTLS_CONFIG_FILE='"dev/mbedtls_heavy_config.h"'

; Uji ECDSA P-256 murni software (micro-ecc): batas BAWAH. Kode: src/host/dev/eksperimen/softwaretes/.
; Hanya kurva secp256r1 yang dikompilasi.
[env:softwaretes]
extends = board_host
build_src_filter = -<*> +<host/dev/eksperimen/softwaretes/>
lib_deps =
  kmackay/micro-ecc@1.0.0
  rweather/Crypto@0.4.0
build_flags =
  ${board_host.build_flags}
  -DuECC_SUPPORTS_secp160r1=0
  -DuECC_SUPPORTS_secp192r1=0
  -DuECC_SUPPORTS_secp224r1=0
  -DuECC_SUPPORTS_secp256k1=0
  -DuECC_SUPPORT_COMPRESSED_POINT=0
