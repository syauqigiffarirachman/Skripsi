# Custom OpenOCD config untuk chip CKS32F103 / CS32F103 Clone
# Chip ini melaporkan Cortex-M0 + Device ID 0x440 (seperti STM32F030x8)
# tapi arsitektur flash-nya kompatibel dengan STM32F1x

source [find interface/stlink.cfg]
transport select hla_swd

# Override CPUTAPID untuk menerima ID chip clone (0x0bb11477)
set CPUTAPID 0x0bb11477

source [find target/stm32f1x.cfg]

# Turunkan clock untuk stabilitas pada chip clone
adapter speed 480

